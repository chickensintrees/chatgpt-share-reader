[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-share-reader"
version = "0.1.0"
description = "Decode chatgpt.com/share/<id> pages into clean Markdown. Pure standard library."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "chickensintrees" }]
keywords = ["chatgpt", "share", "markdown", "turbo-stream", "decoder"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

# No runtime dependencies: standard library only.
dependencies = []

[project.scripts]
chatgpt-share-reader = "chatgpt_share_reader:main"

[tool.setuptools]
py-modules = ["chatgpt_share_reader"]
